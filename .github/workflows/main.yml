name: Pregunta del día
on:
  schedule:
    - cron: "0 8 * * *"      # 09:00 en Madrid en invierno (10:00 en verano)
    - cron: "0 18 * * *"     # 19:00 en Madrid en invierno (20:00 en verano)
  workflow_dispatch:
    inputs:
      banco:
        description: "Banco a publicar"
        required: false
        default: rotacion
        type: choice
        options:
          - rotacion
          - conocimientos
          - ingles
          - gramatica
          - ortografia
permissions:
  contents: write
concurrency: pregunta-del-dia
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python pregunta_del_dia.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          BANCO: ${{ inputs.banco }}
      - name: Guardar estado
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add estado.json
          git commit -m "Pregunta del día $(date +%F_%H)" || true
          git push
